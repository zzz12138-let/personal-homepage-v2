<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>留言管理｜张正卓</title>
<style>:root{--ink:#432c2a;--muted:#80635e;--line:#ead9cf;--accent:#bd5962}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(145deg,#fff6e9,#f6dfd9);font:15px/1.65 system-ui,"PingFang SC",sans-serif}.shell{width:min(960px,calc(100% - 32px));margin:auto;padding:48px 0}.card{border:1px solid rgba(110,70,60,.14);border-radius:22px;background:rgba(255,255,255,.9);box-shadow:0 18px 50px rgba(99,55,48,.1)}.login{width:min(460px,100%);margin:10vh auto;padding:30px}h1{margin:0 0 8px;font-size:clamp(30px,5vw,46px)}p{color:var(--muted)}label{display:block;margin:18px 0 7px;font-weight:750}input,button{font:inherit}input{width:100%;min-height:48px;padding:0 13px;border:1px solid var(--line);border-radius:12px}button{min-height:44px;padding:0 16px;border:0;border-radius:12px;color:#fff;background:linear-gradient(135deg,#df805f,var(--accent));font-weight:750;cursor:pointer}.login button{width:100%;margin-top:14px}.top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.toolbar{display:flex;gap:8px}.list{display:grid;gap:13px}.message{padding:20px}.message.unread{border-left:5px solid var(--accent)}.head{display:flex;justify-content:space-between;gap:15px}.name{font-weight:800}.meta,time{color:var(--muted);font-size:13px}.body{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid var(--line);padding-top:12px}.status{min-height:24px;color:#a84444}.read-toggle{min-height:34px}[hidden]{display:none!important}@media(max-width:600px){.top,.head{align-items:stretch;flex-direction:column}}</style></head>
<body><main class="shell"><section class="card login" id="login"><h1>留言管理</h1><p>仅管理员邮箱可接收登录验证码。</p><form id="login-form"><label for="email">管理员邮箱</label><input id="email" type="email" value="3372794468@qq.com" readonly><button>发送登录链接</button><p class="status" id="login-status" role="status"></p></form></section><section id="admin" hidden><div class="top"><div><h1>访客留言</h1><p id="summary"></p></div><div class="toolbar"><button id="refresh">刷新</button><button id="logout">退出</button></div></div><div class="list" id="list"></div></section></main>
<script src="assets/config.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const CONFIG=window.HOMEPAGE_CONFIG||{};
const SUPABASE_URL=CONFIG.supabaseUrl||'';
const SUPABASE_ANON_KEY=CONFIG.supabasePublishableKey||'';
const ADMIN_EMAIL=CONFIG.adminEmail||'';
const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
document.querySelector('#email').value=ADMIN_EMAIL;
const login=document.querySelector('#login'),admin=document.querySelector('#admin'),statusEl=document.querySelector('#login-status'),list=document.querySelector('#list'),summary=document.querySelector('#summary');
function render(items){list.replaceChildren();const unread=items.filter(x=>!x.is_read).length;summary.textContent=`共 ${items.length} 条，${unread} 条未读。`;if(!items.length){const empty=document.createElement('article');empty.className='card message';empty.textContent='暂时还没有留言。';list.append(empty);return}for(const item of items){const article=document.createElement('article');article.className='card message'+(item.is_read?'':' unread');const head=document.createElement('div');head.className='head';const who=document.createElement('div');const name=document.createElement('div');name.className='name';name.textContent=item.nickname||'匿名访客';const meta=document.createElement('div');meta.className='meta';meta.textContent=item.is_read?'已读':'未读';who.append(name,meta);const side=document.createElement('div');const time=document.createElement('time');time.textContent=new Date(item.created_at).toLocaleString('zh-CN',{hour12:false});const toggle=document.createElement('button');toggle.className='read-toggle';toggle.dataset.id=item.id;toggle.dataset.read=String(item.is_read);toggle.textContent=item.is_read?'标为未读':'标为已读';side.append(time,document.createTextNode(' '),toggle);const body=document.createElement('p');body.className='body';body.textContent=item.message;head.append(who,side);article.append(head,body);list.append(article)}}
async function load(){const {data:{user}}=await supabase.auth.getUser();if(!user||user.email!==ADMIN_EMAIL){login.hidden=false;admin.hidden=true;return}const {data,error}=await supabase.from('feedback').select('id,nickname,message,is_read,created_at').order('created_at',{ascending:false});if(error)throw error;login.hidden=true;admin.hidden=false;render(data||[])}
document.querySelector('#login-form').addEventListener('submit',async e=>{e.preventDefault();statusEl.textContent='正在发送…';const {error}=await supabase.auth.signInWithOtp({email:ADMIN_EMAIL,options:{emailRedirectTo:location.href.split('#')[0]}});statusEl.textContent=error?error.message:'登录链接已发送，请检查邮箱并在同一浏览器打开。'});
document.querySelector('#refresh').onclick=()=>load().catch(e=>alert(e.message));document.querySelector('#logout').onclick=async()=>{await supabase.auth.signOut();location.reload()};list.addEventListener('click',async e=>{const button=e.target.closest('.read-toggle');if(!button)return;button.disabled=true;const {error}=await supabase.from('feedback').update({is_read:button.dataset.read!=='true'}).eq('id',button.dataset.id);if(error)alert(error.message);await load()});supabase.auth.onAuthStateChange(()=>load().catch(e=>{statusEl.textContent=e.message}));load().catch(e=>{statusEl.textContent=e.message});
</script></body></html>
